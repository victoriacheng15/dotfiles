# Turn on mouse support for clicking, resizing, and scrolling
set -g mouse on

setw -g mode-keys vi

set -s set-clipboard on

# Copy mouse selections to system clipboard automatically (requires wl-clipboard)
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

# Start numbering windows at 1 instead of 0 for easier keyboard reach
set -g base-index 1

# Start numbering panes at 1 instead of 0
setw -g pane-base-index 1

# Automatically change window numbers when one is closed to keep the list gapless
set -g renumber-windows on

# Enable 256 colors to ensure terminal applications look correct
set -g default-terminal "screen-256color"

# Increase the amount of text kept in the scrollback history
set -g history-limit 10000

# Use the pipe key for vertical splits and open the new pane in the current path
bind | split-window -h -c "#{pane_current_path}"

# Use the dash key for horizontal splits and open the new pane in the current path
bind - split-window -v -c "#{pane_current_path}"

# Allow switching to the left pane using Alt + Left Arrow without the prefix
bind -n M-Left select-pane -L

# Allow switching to the right pane using Alt + Right Arrow without the prefix
bind -n M-Right select-pane -R

# Allow switching to the top pane using Alt + Up Arrow without the prefix
bind -n M-Up select-pane -U

# Allow switching to the bottom pane using Alt + Down Arrow without the prefix
bind -n M-Down select-pane -D

# Display the time and date in green on the right side of the status bar
set -g status-right "#[fg=black]%H:%M %Y-%m-%d"
