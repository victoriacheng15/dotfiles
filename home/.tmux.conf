# ==============================================================================
# General & Terminal Settings
# ==============================================================================

# Enable 256 colors
set -g default-terminal "screen-256color"

# Increase scrollback history limit
set -g history-limit 10000

# Enable mouse support for clicking, resizing, and scrolling
set -g mouse on

# Number windows and panes starting from 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows when one is closed to keep list gapless
set -g renumber-windows on

# ==============================================================================
# Copy Mode & Clipboard
# ==============================================================================

# Use vi keybindings in copy mode
setw -g mode-keys vi

# Enable system clipboard integration
set -s set-clipboard on

# Copy mouse selections to system clipboard via wl-clipboard
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

# ==============================================================================
# Keybindings (Splits & Navigation)
# ==============================================================================

# Split windows keeping current path (pipe for vertical, dash for horizontal)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Switch panes using Alt + Arrow keys without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# ==============================================================================
# Appearance & Pane Borders
# ==============================================================================

set -g pane-border-style "fg=cyan"
set -g pane-active-border-style "fg=red"

# ==============================================================================
# Status Bar
# ==============================================================================

set -g status-style "bg=black,fg=white"

# Left status: session name
set -g status-left "[#S] "
set -g status-left-length 20

# Window tabs: display directory and active process
setw -g window-status-current-style "bg=colour33,fg=white,bold"
setw -g window-status-current-format " #I:#{b:pane_current_path}/#{pane_current_command}#F "

setw -g window-status-style "bg=black,fg=colour245"
setw -g window-status-format " #I:#{b:pane_current_path}/#{pane_current_command}#F "

# Right status: hostname, military time, and ISO date
set -g status-right '"#H" %H:%M %Y-%m-%d'
set -g status-right-length 50
